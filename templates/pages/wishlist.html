{% extends 'base.html' %}
{% load static %}

{% block title %}Saved Wishlist — Greenland Foodstuff{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
  
  <div class="pb-4 border-b border-slate-200">
    <h1 class="text-2xl sm:text-3xl font-black text-[#124A2E] tracking-tight font-display">
      Saved Wishlist Items (<span x-text="$store.wishlist.count"></span>)
    </h1>
    <p class="text-xs text-slate-500 mt-1">Quickly reorder or add your favorite staples to the cart</p>
  </div>

  <template x-if="$store.wishlist.items.length === 0">
    <div class="max-w-4xl mx-auto px-4 py-16 text-center space-y-4">
      <div class="w-20 h-20 rounded-full bg-[#BA1B1D]/10 text-[#BA1B1D] flex items-center justify-center mx-auto">
        <i data-lucide="heart" class="w-10 h-10"></i>
      </div>
      <h3 class="text-xl font-bold text-slate-800">Your Wishlist is Empty</h3>
      <p class="text-xs text-slate-500">Tap the heart icon on any foodstuff item to save it for later.</p>
      <a href="{% url 'store:products' %}" class="inline-block px-5 py-2.5 bg-[#124A2E] hover:bg-[#D34E1B] text-white rounded-xl text-xs font-bold transition-colors">
        Explore Foodstuffs
      </a>
    </div>
  </template>

  <template x-if="$store.wishlist.items.length > 0">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
      <template x-for="item in $store.wishlist.items" :key="item.id">
        <div class="bg-white rounded-2xl border border-brand-100 overflow-hidden p-4 flex flex-col justify-between space-y-3">
          <div class="aspect-square rounded-xl overflow-hidden bg-[#FAF6EE]">
            <img :src="item.image" :alt="item.name" class="w-full h-full object-cover" />
          </div>
          <div>
            <h4 class="font-bold text-xs text-[#124A2E] line-clamp-1" x-text="item.name"></h4>
            <span class="text-xs font-black text-[#BA1B1D] mt-1 block" x-text="'₹' + item.price"></span>
          </div>
          <div class="flex gap-2 pt-2 border-t border-slate-100">
            <button
              @click="$store.cart.addItem(item)"
              class="flex-1 py-2 bg-[#124A2E] hover:bg-[#D34E1B] text-white rounded-xl text-xs font-bold transition-colors"
            >
              Add to Cart
            </button>
            <button
              @click="$store.wishlist.toggle(item)"
              class="p-2 border border-[#BA1B1D]/20 rounded-xl text-[#BA1B1D] hover:bg-[#BA1B1D]/10 transition-colors"
            >
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </template>
    </div>
  </template>

</div>
{% endblock %}
