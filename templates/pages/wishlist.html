{% extends 'base.html' %}
{% load static %}

{% block title %}Saved Wishlist — Greenland Foodstuff{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
  
  <div class="pb-4 border-b border-slate-200">
    <h1 class="text-2xl sm:text-3xl font-black text-[#124A2E] tracking-tight font-display">
      Saved Wishlist Items (<span x-text="$store.wishlist.count"></span>)
    </h1>
    <p class="text-xs text-slate-500 mt-1">Quickly reorder or add your favorite staples to the cart</p>
  </div>

  <template x-if="$store.wishlist.items.length === 0">
    <div class="max-w-4xl mx-auto px-4 py-16 text-center space-y-4">
      <div class="w-20 h-20 rounded-full bg-[#BA1B1D]/10 text-[#BA1B1D] flex items-center justify-center mx-auto shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-10 h-10 text-[#BA1B1D] fill-[#BA1B1D]/20 stroke-current stroke-2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      </div>
      <h3 class="text-xl font-bold text-slate-800">Your Wishlist is Empty</h3>
      <p class="text-xs text-slate-500 max-w-md mx-auto">Tap the heart icon on any foodstuff item while browsing our catalog to save it for later reordering.</p>
      <a href="{% url 'store:products' %}" class="btn-shine inline-block px-6 py-2.5 bg-[#124A2E] hover:bg-[#D34E1B] text-white rounded-xl text-xs font-bold transition-all shadow-md hover:scale-105">
        Explore Foodstuffs
      </a>
    </div>
  </template>

  <template x-if="$store.wishlist.items.length > 0">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
      <template x-for="item in $store.wishlist.items" :key="item.id">
        <div class="foodstuff-card-glow group bg-white rounded-2xl border border-stone-200/90 shadow-sm p-4 flex flex-col justify-between space-y-3 hover:border-[#FAB82A] transition-all">
          <div class="aspect-square rounded-xl overflow-hidden bg-white border border-stone-100 p-2 flex items-center justify-center group-hover:bg-amber-50/20 transition-colors">
            <img :src="item.image" :alt="item.name" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300" />
          </div>
          <div>
            <h4 class="font-bold text-xs text-[#124A2E] line-clamp-1 group-hover:text-[#D34E1B] transition-colors" x-text="item.name"></h4>
            <span class="text-xs font-black text-[#BA1B1D] mt-1 block" x-text="'KD ' + Number(item.price).toFixed(3)"></span>
          </div>
          <div class="flex gap-2 pt-2 border-t border-slate-100">
            <button
              @click="$store.cart.addItem(item)"
              class="btn-shine flex-1 py-2 bg-[#124A2E] hover:bg-[#D34E1B] text-white rounded-xl text-xs font-bold transition-all shadow-sm active:scale-95"
            >
              Add to Cart
            </button>
            <button
              @click="$store.wishlist.toggle(item)"
              class="p-2 border border-[#BA1B1D]/20 rounded-xl text-[#BA1B1D] hover:bg-[#BA1B1D]/10 hover:border-[#BA1B1D] transition-colors active:scale-90"
              title="Remove from wishlist"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>
              </svg>
            </button>
          </div>
        </div>
      </template>
    </div>
  </template>

</div>
{% endblock %}
